<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sense | Scaling High-Calibre Tech Teams</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --sense-blue: #0055ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Logo Branding */
        .logo-text {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0070f3 0%, #000046 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        header {
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 300;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero {
            padding: 120px 8% 80px 8%;
            max-width: 1200px;
        }

        .accent-line {
            width: 60px;
            height: 4px;
            background: var(--sense-blue);
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 1.2rem;
            color: #aaa;
            max-width: 700px;
            font-weight: 300;
        }

        /* Scaling Section */
        .grid-section {
            padding: 80px 8%;
            background: #050505;
        }

        .label {
            color: var(--sense-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: block;
        }

        .scaling-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .stat-card {
            border-left: 1px solid #333;
            padding-left: 25px;
        }

        .stat-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        /* Advocacy/Community Section */
        .community-section {
            padding: 100px 8%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .bento-box {
            background: var(--glass);
            padding: 40px;
            border: 1px solid #222;
            border-radius: 12px;
        }

        .cta-button {
            background: var(--sense-blue);
            color: white;
            padding: 18px 35px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            border-radius: 4px;
            transition: 0.3s;
            margin-top: 20px;
        }
